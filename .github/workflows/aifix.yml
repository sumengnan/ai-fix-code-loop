# 一个 `/aifix` 开头的 issue（或一条 `/aifix` 评论）→ 一个 PR。
#
# **这个文件必须待在默认分支上**：GitHub 只从默认分支加载 issues /
# issue_comment 的 workflow。在特性分支上改它是调不通的 —— 而且不报错，
# 只是永远不触发。
#
# 逻辑刻意全在 Python 里（`aifix issue handle`），这里只是个壳：改 YAML 要合进
# 默认分支才能测，改 Python 拿一份假 event JSON 在本地就能跑完整条链路。
name: aifix

on:
  # 正文第一行是 /aifix 的新 issue —— 主入口，开 issue 即触发。
  #
  # **只认 opened，不接 edited**：改自己的 issue 正文是完全静默的（没有新通知，
  # 时间线上只有一个不起眼的标记）。接了 edited，一条半年前的 issue 被改成
  # /aifix 开头就能触发，而没有任何人会知道。
  issues:
    types: [opened]
  # 第一行是 /aifix 的评论 —— 用来再跑一次，以及回答 `/aifix <编号>`。
  issue_comment:
    types: [created]

# 同一个 issue 同时只跑一个。手滑连点两次 = 两倍开销，而且两个 run 会抢同一
# 个 worktree 路径。两种事件的 `issue.number` 都在同一个位置，一条就够。
concurrency:
  group: aifix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    # 便宜的前置过滤：绝大多数 issue / 评论在这里就被挡掉，一秒 runner 都不花。
    # 权威判定在 aifix.issue.event.authorize 里（还要挡 PR、bot、命令不在第一
    # 行、以及全部权限判定）。两处都要，不是重复 —— 这里挡不住的由代码挡。
    #
    # **这里刻意不判权限**，尽管加一条 author_association 会更省 runner 分钟数。
    # 理由：没权限的人打了 /aifix，产品要求是**回帖告诉他**（静默丢弃会让他以为
    # 已经在跑了，而那正是本项目栽过十次以上的失败形态）。而 job 的 `if:` 拦下
    # 来的事件**根本不会起 job**，也就没有任何东西能发出那条回帖。
    # 附带的第二个理由：`AIFIX_ALLOWED_USERS` 里的人，author_association 可能
    # 是 NONE —— 在这里判权限会让那份白名单彻底失效。
    #
    # 代价说清楚：任何人开一个 /aifix 开头的 issue 都会起一次 job（约 1~2 分钟
    # runner，零模型调用，随即以一条权限说明收场）。公开仓库上这是一个可被刷的
    # 面 —— 真被刷了，就把权限判据加回这个 `if:`，代价是那些人不再收到解释。
    if: >
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.body, '/aifix')) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/aifix'))

    runs-on: ubuntu-latest
    # 必须显著大于 AIFIX_BUDGET_WALL_SECONDS。Actions 的超时是**杀进程**：
    # run_once 里那个「保证报告先落地」的 except 分支根本执行不到，跑了一小时
    # 什么都留不下。让 aifix 自己的墙钟闸先响，硬杀只是兜底。
    timeout-minutes: 90

    # 显式写全。不写的话仓库默认可能是宽松的，而「我以为它是最小权限」是这类
    # 事故最常见的开头。
    permissions:
      contents: write          # 推交付分支与 aifix/traces
      issues: write            # 状态评论、reaction
      pull-requests: write     # 开 PR

    steps:
      - uses: actions/checkout@v4
        with:
          # 要完整历史：交付分支是从 HEAD 长出来的新分支，从浅克隆推新分支
          # 在部分场景下会被拒（shallow update not allowed）。这个仓库不大，
          # 换几秒 checkout 买掉一整类只在生产出现的失败。
          fetch-depth: 0

      # ↓↓↓ 目标项目自己的测试环境。把你 ci.yml 里那段原样搬过来即可。
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # ↑↑↑

      - run: uv run aifix issue handle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 两条路由的模型都从仓库 variable 读，缺省时退回 flash。
          #
          #   gh variable set AIFIX_FIXER__MODEL    --body deepseek-v4-pro
          #   gh variable set AIFIX_DETECTOR__MODEL --body deepseek-v4-flash
          #
          # variable 名与环境变量**同名**：设什么就是什么，不用记一层映射。
          # 换模型因此不必改这个文件——而改它要合进默认分支才生效
          # （issue_comment 的 workflow 只从默认分支加载），一次换模型要走一次
          # 提交、评审、合并，那个摩擦足以让人干脆不换。
          #
          # 缺省是 flash 而不是 pro：这个默认值会在「还没配就先跑一次」时生效，
          # 那种时候要验的是链路通不通，不是修复质量——拿贵的模型验管道，贵在
          # 了不产生信息的地方。
          #
          # 用 variable 不用 secret：模型名不是机密，而 secret 在日志里会被遮成
          # ***，跑错模型时你从日志里根本看不出来（与价格表同一条理由，见下）。
          # 端点与 key 也各自可配，不设就沿用同一套——两条路由**本来就可以是
          # 两个供应商**（诊断挑便宜的、修复挑强的，未必出自同一家）。不设时
          # 行为与之前完全一致，加这两条不引入任何默认变化。
          #   gh variable set AIFIX_DETECTOR_BASE_URL  # 只在换供应商时才需要
          #   gh secret   set AIFIX_DETECTOR_API_KEY
          #
          # **端点优先取 variable**：它不是机密，而 secret 会被日志遮成 ***，
          # 配错了端点你从日志里根本看不出来（与模型名、价格表同一条理由）。
          # secret 那两层为兼容既有配置保留，不动它也照常工作。
          # aifix-connectivity.yml 的回退链与这里**逐字一致** —— 不一致的话，
          # 那个检查探的就不是这里实际走的路，会说「通」而真正干活的那条是断的。
          AIFIX_FIXER__MODEL: ${{ vars.AIFIX_FIXER__MODEL || 'deepseek-v4-flash' }}
          AIFIX_FIXER__BASE_URL: ${{ vars.AIFIX_FIXER_BASE_URL || secrets.AIFIX_FIXER_BASE_URL || vars.AIFIX_BASE_URL || secrets.AIFIX_BASE_URL }}
          AIFIX_FIXER__API_KEY: ${{ secrets.AIFIX_FIXER_API_KEY || secrets.AIFIX_API_KEY }}
          AIFIX_DETECTOR__MODEL: ${{ vars.AIFIX_DETECTOR__MODEL || 'deepseek-v4-flash' }}
          AIFIX_DETECTOR__BASE_URL: ${{ vars.AIFIX_DETECTOR_BASE_URL || secrets.AIFIX_DETECTOR_BASE_URL || vars.AIFIX_BASE_URL || secrets.AIFIX_BASE_URL }}
          AIFIX_DETECTOR__API_KEY: ${{ secrets.AIFIX_DETECTOR_API_KEY || secrets.AIFIX_API_KEY }}

          # 价格表用 variable 不用 secret：它不是机密，而放进 secret 会被日志
          # 遮蔽成 ***，你反而看不出它配没配对 —— 而没配价格表的后果是美元闸
          # 永远不触发。这个项目为「假的 $0.00」栽过三次。
          AIFIX_PRICE_MAP: ${{ vars.AIFIX_PRICE_MAP }}

          # 额外获准触发 aifix 的登录名，逗号分隔（可选）。
          #
          #   gh variable set AIFIX_ALLOWED_USERS --body "alice,bob"
          #
          # 它是**加法**：默认已经放行仓库所有者、有写入权限的协作者、以及组织
          # 仓库的成员。这份名单用来点名放进按 author_association 认不出来的人。
          #
          # 同样用 variable 不用 secret —— 它不是机密，而 secret 会被日志遮成
          # ***，出问题时你看不出到底谁被放行了。
          AIFIX_ALLOWED_USERS: ${{ vars.AIFIX_ALLOWED_USERS }}

          # 显式配，别靠探测：runner 上 clone 出来没有 .venv，自动探测落空会
          # 退回 aifix 自己的解释器，然后是一整批 collection error —— 见
          # `fix(eval): 评测照着克隆探解释器，探不到`。
          AIFIX_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python

          # 复现那一步的思考模式，**默认关**（与 config.py 里的默认一致）。
          #   gh variable set AIFIX_REPRODUCER_THINKING --body true   # 开回去
          #   gh variable set AIFIX_REPRODUCER_THINKING --body null   # 随端点默认
          #
          # `|| 'false'` 不能省：variable 未设置时 Actions 给的是**空串**，而空串
          # 被 config 的 before-validator 当作「不发这个参数」= 随端点默认 = 开。
          # 那与「默认关」正好相反 —— 一个纯粹由 YAML 语义造成的、和用户意图反着
          # 来的默认值。
          AIFIX_REPRODUCER_THINKING: ${{ vars.AIFIX_REPRODUCER_THINKING || 'false' }}

          # 抬到 config 的默认值。实测（2026-07-30，issue #2，当时的币种是美元）
          # 复现这一步用 pro 跑这个仓库要 0.21 以上，而 0.50 × 0.4 = 0.20 ——
          # 差一点点，两轮都被自己的闸掐在门口。这个数字随**目标仓库规模**走，
          # 不是通用值。单位是**人民币**（旧名 AIFIX_BUDGET_USD 仍按美元读）。
          AIFIX_BUDGET_CNY: ${{ vars.AIFIX_BUDGET_CNY || '15.0' }}
          AIFIX_BUDGET_WALL_SECONDS: "3600"

      # 崩了才最需要它。`if: always()` 不是可选的 —— job 失败时不上传，等于
      # 恰好在最需要诊断数据的那一次把它扔了。
      #
      # 这里是**全量**（含体积大的 events.jsonl），供 aifix replay。
      # facts + report 另有一条永久去处（aifix/traces 分支），由 handle 自己推。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aifix-trace-${{ github.event.issue.number }}-${{ github.run_id }}
          path: .aifix/runs/
          retention-days: 90
