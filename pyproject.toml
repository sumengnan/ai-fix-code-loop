[project]
# **发行名与 import 名刻意不同**，这不是笔误：
#   发行名（pip install aifix-code）—— `aifix` 在 PyPI 上已被另一个无关的包
#                                      占用（0.2 版，2026-08-01 查），拿不到。
#   import 名（import aifix）        —— 保持不变。改它要动每一个文件的每一行
#                                      import，换不来任何东西。
#   命令名（aifix run ...）          —— 保持不变。issue 上的 `/aifix` 命令、
#                                      产物目录 `.aifix/`、全部文档都是这个词。
# 与 scikit-learn → sklearn 同一个形状。
name = "aifix-code"
version = "0.1.2"
description = "测试失败驱动的自我修复 agentic loop：红着的测试进去，一条验证过的补丁分支出来"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sumengnan" }]
# PEP 639 的写法（SPDX 表达式 + 许可证文件清单），需要 Metadata-Version 2.4。
# 不写的话 PyPI 页面显示「许可证未知」，而在法律上那等于「保留所有权利」——
# 别人不敢用，也过不了公司的合规检查。
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "llm", "pytest", "maven", "test-repair", "langgraph",
            "code-repair", "自动修复", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 刻意**不列** Windows：venv 探测里那条 Windows 分支从没在真机上验证过
    # （见 adapters/pytest_adapter.py 那段注释），列上去就是一句没有依据的话。
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    # 0.0.2 起提供 aifix 依赖的两处能力：LocalSandbox 接管既有目录、
    # AgentLoop.run 接收初始消息。
    # 0.0.3 起 run()/resume() 被 aclose() 时会终结内层生成器 —— 成本闸越线
    # 中止时正是这么关流的，0.0.2 上那一关关不到内层，ExitStack（还原打转
    # 纠偏的采样升温）与三层 span 要等事件循环回收才清理，时机不确定。
    # 不要降到 0.0.2 以下。
    "ai-harness-framework>=0.0.3",
    # eval 的数据模型（Task / TaskResult / Summary）直接 import pydantic。
    # 它此前只是靠 ai-harness-framework 传递进来的隐式依赖 —— 公开的数据
    # 模型层不能依赖别人的依赖树。
    "pydantic>=2.7",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.urls]
Homepage = "https://github.com/sumengnan/aifix-code"
Repository = "https://github.com/sumengnan/aifix-code"
Documentation = "https://github.com/sumengnan/aifix-code/tree/main/docs"
Issues = "https://github.com/sumengnan/aifix-code/issues"

[project.scripts]
aifix = "aifix.cli:main"

[dependency-groups]
# pyyaml 是 tests/test_workflow.py 用的：那份测试把 .github 里几条**安全控制**
# 钉住（谁能触发、issue 作者是不是本人、权限清单）。它此前只是靠 langgraph 传
# 递进来的隐式依赖 —— 与 pydantic 当初那处同一个形状：上游哪天不再依赖它，
# 掉的不是一个测试，是那几条守卫再也没人看着了。
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests 也进去：几个测试文件之间要共享探测器（`npm install --offline` 装不装
# 得上 vitest、`mvn -o` 跑不跑得起来）。不加的话 `from test_vitest_adapter
# import _vitest_skip` 是 ModuleNotFoundError，而替代方案是把同一段探测
# 逻辑复制几份 —— 复制出来的探测器会各自漂移。
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifix"]

# 明确列出来，而不是靠 hatchling 的默认（「除 VCS 忽略之外全收」）：那个默认
# 会把 `.claude/`、`.idea/` 这些**只对本机开发有意义**的目录一起塞进源码包。
# tests 与 docs 是有意留下的 —— 装了源码包的人要能自己跑一遍验收。
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md"]
