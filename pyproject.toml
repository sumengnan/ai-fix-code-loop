[project]
name = "aifix"
version = "0.1.0"
description = "测试失败驱动的自我改进 agentic loop"
requires-python = ">=3.11"
dependencies = [
    # 0.0.2 起提供 aifix 依赖的两处能力：LocalSandbox 接管既有目录、
    # AgentLoop.run 接收初始消息。不要降到 0.0.1。
    "ai-harness-framework>=0.0.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.scripts]
aifix = "aifix.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifix"]
